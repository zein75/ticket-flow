services:
  postgres:
    image: postgres:16
    container_name: ticketflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ticketflow}
      POSTGRES_USER: ${POSTGRES_USER:-ticketflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ticketflow_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ticketflow} -d ${POSTGRES_DB:-ticketflow}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: ticketflow-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/TicketFlow.Api/Dockerfile
    container_name: ticketflow-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-ticketflow};Username=${POSTGRES_USER:-ticketflow};Password=${POSTGRES_PASSWORD:-ticketflow_password}
      ConnectionStrings__Redis: redis:6379
      Auth__AccessTokenMinutes: ${AUTH_ACCESS_TOKEN_MINUTES:-15}
      Auth__RefreshTokenDays: ${AUTH_REFRESH_TOKEN_DAYS:-30}
      Jwt__Issuer: ${JWT_ISSUER:-TicketFlow}
      Jwt__Audience: ${JWT_AUDIENCE:-TicketFlow.Api}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-ticketflow-development-signing-key-change-me-64-characters}
    ports:
      - "${API_HTTP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: src/TicketFlow.Worker/Dockerfile
    container_name: ticketflow-worker
    restart: unless-stopped
    environment:
      DOTNET_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-ticketflow};Username=${POSTGRES_USER:-ticketflow};Password=${POSTGRES_PASSWORD:-ticketflow_password}
      ConnectionStrings__Redis: redis:6379
      Auth__AccessTokenMinutes: ${AUTH_ACCESS_TOKEN_MINUTES:-15}
      Auth__RefreshTokenDays: ${AUTH_REFRESH_TOKEN_DAYS:-30}
      Jwt__Issuer: ${JWT_ISSUER:-TicketFlow}
      Jwt__Audience: ${JWT_AUDIENCE:-TicketFlow.Api}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-ticketflow-development-signing-key-change-me-64-characters}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
